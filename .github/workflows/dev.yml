name: Dev App Build and Push

on:
  push:
    branches: [develop, main, test_gha_build_deploy_update]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REPO: "533267153582.dkr.ecr.us-east-1.amazonaws.com/prep-intel-app"
  IMAGE_VERSION: latest 
  DB_USERNAME: ${{vars.DB_USERNAME}}
  DB_PASSWORD: ${{vars.DB_PASSWORD}}
  DB_NAME: ${{vars.DB_NAME}}
  DB_HOST: ${{vars.DB_HOST}}
  NEXTAUTH_URL: ${{vars.NEXTAUTH_URL}}
  AWS_ACCESS_KEY_ID: ${{vars.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{vars.AWS_SECRET_ACCESS_KEY}}
  BUCKET_NAME: ${{vars.BUCKET_NAME}}
  NEXTAUTH_SECRET: "test"

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        
      - name: Build tagged Docker image
        env:
          IMAGE_VERSION: latest
        run: |
          docker build -t ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }} \
          --build-arg DB_USERNAME=${{env.DB_USERNAME}} \
          --build-arg DB_PASSWORD=${{env.DB_PASSWORD}} \
          --build-arg DB_NAME=${{env.DB_NAME}} \
          --build-arg DB_HOST=${{env.DB_HOST}} \
          --build-arg NEXTAUTH_SECRET=${{env.NEXTAUTH_SECRET}} \
          --build-arg AWS_ACCESS_KEY_ID=${{env.AWS_ACCESS_KEY_ID}} \
          --build-arg AWS_REGION=${{env.AWS_REGION}} \
          --build-arg AWS_SECRET_ACCESS_KEY=${{env.AWS_SECRET_ACCESS_KEY}} \
          --build-arg BUCKET_NAME=${{env.BUCKET_NAME}} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Push tagged Docker image to ECR
        run: |
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: us-east-1

      #INTERIM ENV REFRESH
      - name: Refresh ASG for testing infrastructure
        run: |
          aws autoscaling start-instance-refresh \
          --auto-scaling-group-name Infra-ECS-Cluster-prep-intel-test-cluster-5782ea1b-ECSAutoScalingGroup-rF6sAHZRw0lv \
          --preferences '{"InstanceWarmup": 60, "MinHealthyPercentage": 50}'
      #INTERIM ENV REFRESH

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: prep-intel-dev
          image: ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}
          environment-variables: "AWS_SDK_LOAD_CONFIG=1"

      # - name: Deploy image to Amazon ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: ${{ steps.render-task-def.outputs.task-definition }}
      #     service: prep-intel-dev
      #     cluster: prep-intel-test-cluster
      #     wait-for-service-stability: true

