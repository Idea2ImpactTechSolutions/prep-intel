name: Production App Docker Build and Push

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REPO: "533267153582.dkr.ecr.us-east-1.amazonaws.com/prep-intel-app"
  IMAGE_VERSION: prod-latest
  ECS_CLUSTER: "prep-intel-prod"
  ECS_SERVICE: "prep-intel-prod-svc"

jobs:
  tag-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        run: |
          RELEASE_TAG=${{ github.event.release.tag_name }}
          COMMIT_SHA=$(git rev-parse --short HEAD)
          docker pull ${{ env.ECR_REPO }}:$COMMIT_SHA
          docker tag ${{ env.ECR_REPO }}:$COMMIT_SHA ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}
          docker tag ${{ env.ECR_REPO }}:$COMMIT_SHA ${{ env.ECR_REPO }}:$RELEASE_TAG
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}
          docker push ${{ env.ECR_REPO }}:$RELEASE_TAG

  deploy:
    needs: tag-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment in ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}