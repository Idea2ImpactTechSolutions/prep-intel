name: App Docker Build and Push

on:
  push:
    branches: [main, update_gha_docker-issue]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REPO: "533267153582.dkr.ecr.us-east-1.amazonaws.com/prep-intel-app"
  IMAGE_VERSION: latest
  DB_USERNAME: ${{secrets.DB_USERNAME}}
  DB_PASSWORD: ${{secrets.DB_PASSWORD}}
  DB_NAME: ${{secrets.DB_NAME}}
  DB_HOST: ${{secrets.DB_HOST}}
  TOKEN_SECRET: ${{secrets.TOKEN_SECRET}}
  NEXTAUTH_URL: "http://prep-intel-dev-alb-1208390994.us-east-1.elb.amazonaws.com"
  NEXTAUTH_SECRET: "test"


jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build tagged Docker image
        run: |
          docker build -t ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }} \
          --build-arg DB_USERNAME=${{env.DB_USERNAME}} \
          --build-arg DB_PASSWORD=${{env.DB_PASSWORD}} \
          --build-arg DB_NAME=${{env.DB_NAME}} \
          --build-arg DB_HOST=${{env.DB_HOST}} \
          --build-arg TOKEN_SECRET=${{env.TOKEN_SECRET}} \
          --build-arg NEXTAUTH_URL=${{env.NEXTAUTH_URL}} \
          --build-arg NEXTAUTH_SECRET=${{env.NEXTAUTH_SECRET}} .

      - name: Push tagged Docker image to ECR
        run: |
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout
      
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        run: |
          IMAGE_URI="${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}"
          TASK_DEF=$(sed -e "s|<CONTAINER_NAME>:latest|${IMAGE_URI}|g" task-definition.json)
          echo "::set-output name=task_definition::${TASK_DEF}"

      # - name: Deploy image to Amazon ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
