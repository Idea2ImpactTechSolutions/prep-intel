name: App Docker Build and Push

on:
  push:
    branches: [ PREP-67-gha-app-build ]

env:
  AWS_REGION : "us-east-1"
  ECR_REPO: "533267153582.dkr.ecr.us-east-2.amazonaws.com/prep-intel-app"
    
# Permission can be added at job level or workflow level    
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout app code
      uses: actions/checkout@v4
      with:
        ref: "main"
 

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v1.7.0
      with:
        role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
        role-session-name: AWS_PrepIntel_GHA_Role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-prep-intel-aws-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: push tagged docker image to ECR
      env:
        # IMAGE_VERSION: "latest"
        IMAGE_TAG: latest
      run: |
        docker build -t ${{env.AWS_REGION}}:$IMAGE_TAG .
        docker push ${{env.AWS_REGION}}:$IMAGE_TAG

