name: App Docker Build and Push

on:
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REPO: "533267153582.dkr.ecr.us-east-1.amazonaws.com/prep-intel-app"
  IMAGE_VERSION: dev-latest
  ECS_CLUSTER: "prep-dev"
  ECS_SERVICE: "prep-dev-svc"

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          docker build -t ${{ env.ECR_REPO }}:$COMMIT_SHA -t ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }} .

      - name: Push tagged Docker image to ECR
        run: |
          docker push ${{ env.ECR_REPO }}:$COMMIT_SHA
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_VERSION }}

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for requesting the JWT
      contents: read    # Required for actions/checkout

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::533267153582:role/AWS_PrepIntel_GHA_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment in ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
